<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>എട്ടുനോമ്പ് തിരുനാൾ | പള്ളി തിരുനാൾ കലണ്ടർ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;700&display=swap" rel="stylesheet">
<!-- html2canvas for Download Feature -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="main-container" id="poster-content">
  
  <div class="header">
    <div class="title-area">
      <h1>എട്ടുനോമ്പ് തിരുനാൾ</h1>
      <div class="date-subtitle">ആഗസ്റ്റ് 31 മുതൽ സെപ്റ്റംബർ 8 വരെ</div>
    </div>
  </div>

  <div class="controls" data-html2canvas-ignore="true">
    <button class="btn btn-overall active" id="showOverall">മുഴുവൻ സമയക്രമം</button>
    <button class="btn btn-daily" id="showDaily">ഓരോ ദിവസത്തെയും</button>
    <select id="dateSelector">
      <option value="" disabled selected>തീയതി തിരഞ്ഞെടുക്കുക</option>
    </select>
    <button class="btn btn-download" id="downloadBtn">പോസ്റ്റർ ഡൗൺലോഡ് ചെയ്യുക</button>
  </div>

  <div class="poster-wrapper">
    <div id="overallView">
      <!-- Schedule cards for all days will be inserted here -->
    </div>
    
    <div id="dailyView">
      <img src="" id="dailyImage" alt="പരിശുദ്ധ അമ്മ">
      <div id="focusDate"></div>
      <div id="focusEvents">
        <ul></ul>
      </div>
    </div>
  </div>

  <div class="main-footer">
    എല്ലാവരെയും എട്ടുനോമ്പ് തിരുനാൾ തിരുക്കർമ്മങ്ങളിൽ ഭക്തിപൂർവ്വം പങ്കുചേരുവാൻ സ്നേഹപൂർവ്വം ക്ഷണിക്കുന്നു.
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
